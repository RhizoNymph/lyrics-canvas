{{- $needKey := not .Values.backend.existingSecret }}
{{- $needUrl := include "lyrics-canvas.externalDatabase.managed" . }}
{{- if or $needKey $needUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lyrics-canvas.backend.fullname" . }}
  labels:
    {{- include "lyrics-canvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
data:
  {{- if $needKey }}
  secret-key: {{ include "lyrics-canvas.backend.secretKey" . | b64enc | quote }}
  {{- end }}
  {{- if $needUrl }}
  database-url: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
