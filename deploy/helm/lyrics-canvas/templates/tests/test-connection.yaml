apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lyrics-canvas.fullname" . }}-test-connection
  labels:
    {{- include "lyrics-canvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "lyrics-canvas.imagePullSecrets" . | nindent 2 }}
  containers:
    - name: check
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -e
          wget -qO- {{ include "lyrics-canvas.frontend.url" . }}/healthz
          wget -qO- {{ include "lyrics-canvas.backend.url" . }}/api/health
