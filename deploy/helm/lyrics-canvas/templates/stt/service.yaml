{{- if .Values.stt.enabled }}
# Always ClusterIP: the STT API has no auth and is only for the backend.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lyrics-canvas.stt.fullname" . }}
  labels:
    {{- include "lyrics-canvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: stt
spec:
  type: ClusterIP
  selector:
    {{- include "lyrics-canvas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: stt
  ports:
    - name: http
      port: {{ .Values.stt.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
