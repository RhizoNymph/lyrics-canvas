{{- if .Values.postgres.enabled }}
{{- $p := .Values.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lyrics-canvas.postgres.fullname" . }}
  labels:
    {{- include "lyrics-canvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "lyrics-canvas.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "lyrics-canvas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "lyrics-canvas.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
        {{- with $p.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $p.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "lyrics-canvas.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "lyrics-canvas.serviceAccountName" . }}
      {{- with $p.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "lyrics-canvas.image" (dict "image" $p.image "default" "pg16") }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          {{- with $p.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ $p.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ $p.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lyrics-canvas.postgres.secretName" . }}
                  key: {{ $p.auth.existingSecretPasswordKey }}
            # Subdirectory so a freshly provisioned volume's lost+found does not
            # stop initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          {{- with $p.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: initdb
          configMap:
            name: {{ include "lyrics-canvas.postgres.fullname" . }}-initdb
        {{- if not $p.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $p.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "lyrics-canvas.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: postgres
      spec:
        accessModes:
          {{- toYaml $p.persistence.accessModes | nindent 10 }}
        {{- if $p.persistence.storageClass }}
        storageClassName: {{ $p.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.persistence.size | quote }}
  {{- end }}
{{- end }}
