{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lyrics-canvas.postgres.fullname" . }}
  labels:
    {{- include "lyrics-canvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  password: {{ include "lyrics-canvas.postgres.password" . | b64enc | quote }}
{{- end }}
