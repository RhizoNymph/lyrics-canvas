{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lyrics-canvas.fullname" . }}
  labels:
    {{- include "lyrics-canvas.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hosts }}
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        {{- include "lyrics-canvas.ingress.paths" $ | nindent 8 }}
    {{- end }}
    {{- else }}
    {{- /* No hosts: one catch-all rule, matched for any Host header (bare IPs included). */}}
    - http:
        {{- include "lyrics-canvas.ingress.paths" . | nindent 8 }}
    {{- end }}
{{- end }}
