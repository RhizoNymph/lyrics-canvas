# Home microk8s cluster (node0/node1/node2). Workloads stay on node0 and node1.
# Images are built on node0 and pushed to the microk8s registry addon.
#
# Deploy with deploy/homelab/deploy.sh, which builds images tagged with the
# short commit SHA and passes --set {backend,frontend,stt}.image.tag=<sha>. The
# `dev` tags below are only the fallback for a manual helm run.
#
# Credentials are generated in-cluster on first install and kept on upgrade.
# To set any explicitly, put them in homelab.secret.yaml (gitignored) and pass
# it after this file:
#   microk8s helm3 upgrade --install lyrics deploy/helm/lyrics-canvas \
#     -n lyrics-canvas -f deploy/helm/environments/homelab.yaml \
#     [-f deploy/helm/environments/homelab.secret.yaml]

backend:
  image:
    repository: localhost:32000/lyrics-canvas-backend
    tag: dev
    pullPolicy: IfNotPresent
  modelCache:
    persistence:
      enabled: true
      size: 2Gi
  affinity: &homelabNodes
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node0
                  - node1

frontend:
  image:
    repository: localhost:32000/lyrics-canvas-frontend
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    # The app is reached at http://10.1.1.69:32443 (node0's IP; the node names
    # are ssh aliases, not DNS names, so use the IP in URLs).
    nodePort: 32443
  # kube-prometheus-stack's Alertmanager; feeds the in-app outage banner.
  clusterAlerts:
    alertmanagerUrl: http://kps-alertmanager.monitoring.svc:9093
  affinity: *homelabNodes

postgres:
  affinity: *homelabNodes

# Speech-to-text on node1's RTX 3090 (GPU operator installed; node1's default
# containerd runtime is runc, so the pod must ask for the `nvidia` runtime class).
# Weights (large-v3-turbo, ~1.6 GB) live on node1's disk so they survive pod,
# PVC and release churn and download only once. Create the directory first,
# owned by nymph:  ssh node1 mkdir -p /home/nymph/models/whisper
stt:
  enabled: true
  image:
    repository: localhost:32000/lyrics-canvas-stt
    tag: dev
    pullPolicy: IfNotPresent
  device: cuda
  gpus: 1
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: node1
  modelCache:
    type: hostPath
    hostPath:
      path: /home/nymph/models/whisper
  # Run as nymph (1000:1000) so the hostPath cache is owned by the same user
  # as the directory on node1.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

# Nightly pg_dump to node1's disk (the NAS is out). The directory must exist on
# node1, owned by nymph (1000:1000); dumps are created as that user so the
# laptop pull (deploy/homelab/backup) can read them over ssh.
backup:
  enabled: true
  schedule: "15 3 * * *"
  timeZone: America/Los_Angeles
  retain: 14
  runAsUser: 1000
  runAsGroup: 1000
  destination:
    type: hostPath
    hostPath:
      path: /home/nymph/backups/lyrics-canvas
  nodeSelector:
    kubernetes.io/hostname: node1

# kube-prometheus-stack (release kps, namespace monitoring) loads every
# PrometheusRule in the cluster. Alert routing lives in its Alertmanager config.
monitoring:
  prometheusRule:
    enabled: true
    kubectlCommand: microk8s kubectl
