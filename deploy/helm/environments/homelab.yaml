# Home microk8s cluster (node0/node1/node2). Workloads stay on node0 and node1.
# Images are built on node0 and pushed to the microk8s registry addon.
#
# Deploy with deploy/homelab/deploy.sh, which builds images tagged with the
# short commit SHA and passes --set {backend,frontend}.image.tag=<sha>. The
# `dev` tags below are only the fallback for a manual helm run.
#
# Credentials are generated in-cluster on first install and kept on upgrade.
# To set any explicitly, put them in homelab.secret.yaml (gitignored) and pass
# it after this file:
#   microk8s helm3 upgrade --install lyrics deploy/helm/lyrics-canvas \
#     -n lyrics-canvas -f deploy/helm/environments/homelab.yaml \
#     [-f deploy/helm/environments/homelab.secret.yaml]

backend:
  image:
    repository: localhost:32000/lyrics-canvas-backend
    tag: dev
    pullPolicy: IfNotPresent
  modelCache:
    persistence:
      enabled: true
      size: 2Gi
  affinity: &homelabNodes
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node0
                  - node1

frontend:
  image:
    repository: localhost:32000/lyrics-canvas-frontend
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    # The app is reached at http://10.1.1.69:32443 (node0's IP; the node names
    # are ssh aliases, not DNS names, so use the IP in URLs).
    nodePort: 32443
  affinity: *homelabNodes

postgres:
  affinity: *homelabNodes
