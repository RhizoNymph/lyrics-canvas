# Home microk8s cluster (node0/node1/node2). Workloads stay on node0 and node1.
# Images are built on node0 and pushed to the microk8s registry addon.
#
# Deploy with deploy/homelab/deploy.sh, which builds images tagged with the
# short commit SHA and passes --set {backend,frontend}.image.tag=<sha>. The
# `dev` tags below are only the fallback for a manual helm run.
#
# Credentials are generated in-cluster on first install and kept on upgrade.
# To set any explicitly, put them in homelab.secret.yaml (gitignored) and pass
# it after this file:
#   microk8s helm3 upgrade --install lyrics deploy/helm/lyrics-canvas \
#     -n lyrics-canvas -f deploy/helm/environments/homelab.yaml \
#     [-f deploy/helm/environments/homelab.secret.yaml]

backend:
  image:
    repository: localhost:32000/lyrics-canvas-backend
    tag: dev
    pullPolicy: IfNotPresent
  modelCache:
    persistence:
      enabled: true
      size: 2Gi
  affinity: &homelabNodes
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - node0
                  - node1

frontend:
  image:
    repository: localhost:32000/lyrics-canvas-frontend
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    # The app is reached at http://10.1.1.69:32443 (node0's IP; the node names
    # are ssh aliases, not DNS names, so use the IP in URLs).
    nodePort: 32443
  # kube-prometheus-stack's Alertmanager; feeds the in-app outage banner.
  clusterAlerts:
    alertmanagerUrl: http://kps-alertmanager.monitoring.svc:9093
  affinity: *homelabNodes

postgres:
  affinity: *homelabNodes

# HTTPS through the microk8s ingress addon (ingress-nginx, class `public`,
# hostPort 80/443 on every node), so browsers allow microphone access at
# https://10.1.1.69/ (LAN) and https://100.64.0.4/ (tailnet). The NodePort
# above stays for plain-HTTP clients such as the Android app.
#
# No hosts: one catch-all rule, because requests for bare IPs carry the IP as
# Host. Browsers send no SNI to IP addresses, so ingress-nginx answers them with
# its default certificate; point that at the Secret below once per cluster
# (`microk8s enable ingress:default-ssl-certificate=lyrics-canvas/lyrics-canvas-tls`).
# The Secret holds a server certificate from a local CA and is created by
# deploy/homelab/tls/issue-cert.sh; no key material is ever in this file.
# See docs/features/homelab_tls.md.
ingress:
  enabled: true
  className: public
  hosts: []
  tls:
    - secretName: lyrics-canvas-tls
  annotations:
    # Voice-take uploads: up to 25 MiB of audio plus multipart overhead.
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
    # Above the backend's 120 s speech-to-text timeout.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    # http://<node>/ on port 80 redirects to HTTPS.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

# Nightly pg_dump to node1's disk (the NAS is out). The directory must exist on
# node1, owned by nymph (1000:1000); dumps are created as that user so the
# laptop pull (deploy/homelab/backup) can read them over ssh.
backup:
  enabled: true
  schedule: "15 3 * * *"
  timeZone: America/Los_Angeles
  retain: 14
  runAsUser: 1000
  runAsGroup: 1000
  destination:
    type: hostPath
    hostPath:
      path: /home/nymph/backups/lyrics-canvas
  nodeSelector:
    kubernetes.io/hostname: node1

# kube-prometheus-stack (release kps, namespace monitoring) loads every
# PrometheusRule in the cluster. Alert routing lives in its Alertmanager config.
monitoring:
  prometheusRule:
    enabled: true
    kubectlCommand: microk8s kubectl
