[project]
name = "lyrics-canvas-stt"
version = "0.1.0"
description = "Cluster-internal speech-to-text service (faster-whisper) for Lyrics Canvas voice capture"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    # faster-whisper 1.2.1 imports `requests` and relies on the requests-based
    # hub client for its offline fallback; huggingface-hub 1.x switched to httpx.
    "huggingface-hub==0.36.2",
    # faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), removed in av 19.
    "av==18.1.0",
]

[project.scripts]
stt-service = "stt_service.main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_service"]

[tool.uv]
# Resolve only releases that have been public for at least a week.
exclude-newer = "2026-10-24T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: loads a real (tiny) faster-whisper model; skipped when its weights are not cached",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
